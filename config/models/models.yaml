models:

  openrouter-gemma:
    provider: openrouter
    model: google/gemma-3-27b-it
    status: enabled

    capabilities:
      - chat
      - reasoning
      - json

    context_window: 128000

    priority: 100

    tags:
      - fast
      - cheap
      - coding

  openai-gpt-5:
    provider: openai
    model: gpt-5
    status: disabled

    capabilities:
      - chat
      - reasoning
      - vision
      - json
      - tool-calling

    context_window: 400000

    priority: 200

    tags:
      - premium
      - accurate

aliases:

  assistant-default: openrouter-gemma
  coding: openrouter-gemma
  reasoning: openrouter-gemma
