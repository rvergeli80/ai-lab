[project]
name = "gateway-manager"
version = "0.1.0"
description = "Gateway Manager"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.93.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
gateway = "gateway_manager.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_manager"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
